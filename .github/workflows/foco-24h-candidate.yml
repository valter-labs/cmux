name: Foco 24h candidate
run-name: Foco 24h Release ${{ github.sha }}

on:
  push:
    branches: [build/foco-24h-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foco-24h-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'valter-labs/cmux' && github.ref == 'refs/heads/build/foco-24h-release'
    # The owned image has only CLT; use hosted Xcode until that image is provisioned.
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CMUX_DEV_BACKEND_MODE: local
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout and Swift syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify-local.py --only swift-syntax \
            --swift Sources/Mobile/AgentChat/AgentChatSessionRegistry.swift \
            cmuxTests/AgentChatSessionRegistryLifecycleTests.swift
      - name: Select Xcode
        run: |
          mkdir -p foco-cache-evidence
          {
            sw_vers
            xcode-select -p
            swift --version
            ./scripts/select-ci-xcode.sh
          } 2>&1 | tee foco-cache-evidence/toolchain.txt
      - name: Set up Go for the Release tunnel extension
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Record Go toolchain
        run: go version | tee -a foco-cache-evidence/toolchain.txt
      - name: Prepare native dependencies
        run: |
          git submodule update --init --recursive
          GHOSTTYKIT_DOWNLOAD_RETRIES=2 GHOSTTYKIT_DOWNLOAD_RETRY_DELAY=5 \
            GHOSTTYKIT_DOWNLOAD_MAX_TIME=120 ./scripts/download-prebuilt-ghosttykit.sh
      - name: Build isolated optimized package
        run: |
          # Universal whole-module Release exceeded this runner's two-hour limit.
          # shortcut: ARM64 only; restore universal WMO on a capable release runner.
          printf '%s\n' 'ARCHS = arm64' 'SWIFT_COMPILATION_MODE = singlefile' > "$RUNNER_TEMP/foco-optimization.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/foco-optimization.xcconfig" \
            ./scripts/reload.sh --tag foco-release-20261025 --name "cmux Foco" \
            --release --derived-data "$RUNNER_TEMP/foco-release-app" \
            --swift-frontend-workaround --no-global-cli-links \
            2>&1 | tee foco-cache-evidence/build.txt
          APP="$RUNNER_TEMP/foco-release-app/Build/Products/Release/cmux Foco.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.cmuxterm.app.debug.foco.release.20261025"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" foco-cache-evidence/app.zip
          git rev-parse HEAD > foco-cache-evidence/source-sha.txt
          git ls-tree HEAD Sources cmuxTests scripts cmux.xcodeproj > foco-cache-evidence/source-trees.txt
          shasum -a 256 foco-cache-evidence/app.zip > foco-cache-evidence/SHA256SUMS
      - name: Preserve compiler output after cancellation
        if: always()
        run: |
          if [[ -f /tmp/cmux-reload-foco-release-20261025.log ]]; then
            cp /tmp/cmux-reload-foco-release-20261025.log foco-cache-evidence/compiler.txt
          fi
      - name: Upload build and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foco-24h-release-${{ github.sha }}
          path: foco-cache-evidence/
          if-no-files-found: warn
          retention-days: 7
